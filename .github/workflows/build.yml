name: Build Windows EXE & Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name InternetDoctor
          --icon assets/icon.ico
          --add-data "assets;assets"
          --collect-all customtkinter
          --hidden-import pystray._win32
          main.py

      - name: Build Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InternetDoctor-windows
          path: |
            dist/InternetDoctor.exe
            dist/InternetDoctor-Setup-*.exe
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/InternetDoctor.exe \
            dist/InternetDoctor-Setup-*.exe \
            --title "Internet Doctor ${GITHUB_REF_NAME}" \
            --notes "Automatic internet-outage diagnosis & repair for Windows 10/11.

            - InternetDoctor.exe          portable, no install needed
            - InternetDoctor-Setup-*.exe  full installer (optional autostart)

            See the README for usage and FAQ." \
            --latest
