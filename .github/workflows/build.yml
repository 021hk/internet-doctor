name: Build Windows EXE & Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name InternetDoctor
          --icon assets/icon.ico
          --collect-all customtkinter
          --hidden-import pystray._win32
          main.py

      - name: Build Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InternetDoctor-windows
          path: |
            dist/InternetDoctor.exe
            dist/InternetDoctor-Setup-*.exe
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-ghrelease@v2
        with:
          files: |
            dist/InternetDoctor.exe
            dist/InternetDoctor-Setup-*.exe
          generate_release_notes: true
